name: Test and publish Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Push the tested image to Docker Hub (main or a version tag only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: starsdream666/temp-mail-gateway

jobs:
  check:
    name: Typecheck, tests and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run frontend:build

  docker:
    name: Build, smoke-test and publish
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_IMAGE: temp-mail-gateway-smoke:${{ github.sha }}
      PUBLISH: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match package.json: v$version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.licenses=MIT
      - name: Build and load the image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SMOKE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the actual image
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          docker run -d --name tmg-smoke \
            --env MASTER_KEY=ci-smoke-master-key-not-for-production \
            --env ADMIN_PASSWORD=ci-smoke-password-not-for-production \
            --env DOCKER_SMOKE_TEST=1 \
            --mount "type=bind,src=$PWD/scripts/smoke-docker.mjs,dst=/tmp/smoke-docker.mjs,readonly" \
            "$SMOKE_IMAGE"
          healthy=false
          for attempt in {1..60}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' tmg-smoke)
            if [[ "$status" == healthy ]]; then
              healthy=true
              break
            fi
            if [[ "$status" == unhealthy ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != true ]]; then
            docker logs tmg-smoke
            exit 1
          fi
          docker exec tmg-smoke node /tmp/smoke-docker.mjs "$EXPECTED_VERSION"
      - name: Show container logs on failure
        if: failure()
        run: docker logs tmg-smoke || true
      - name: Remove the disposable test container and its volume
        if: always()
        run: docker rm -fv tmg-smoke || true
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: starsdream666
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image with all generated tags
        if: env.PUBLISH == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "$SMOKE_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          {
            echo '### Published Docker Hub tags'
            printf '%s\n' "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
